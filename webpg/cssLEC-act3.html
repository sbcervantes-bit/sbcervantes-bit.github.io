<!DOCTYPE html>
<html>
<head>
    <title>CSS Seatwork</title>

    <style>
        body {
            background-color: lightgray;
            font-family: Arial;
        }
        
        .profile {
            background-color: white;
            padding: 20px;
            border: 2px solid navy;
            width: 400px;
            margin: auto;}
            
        h1 {background-color: navy;
            padding: 15px;
            margin-top: 0px;
            text-align: center;
            color: white
        }

        img {
            display: block;
            margin: auto;
            width: 100px;
            height: 100px;
        }

        .program {
            text-align: center;
            color: lightgrey;
            margin-top: 0px;
        }

        h2 {
            color: navy;
            text-align: center;
            margin-bottom: 0px;
        }

        h3 {
            color: navy;
            border-bottom: 2px solid lightblue;
            padding-bottom: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            padding: 10px;
            background-color: lightblue;
            border: 1px solid lightgrey            
        }

        td {
            padding: 8px;
            border: 1px solid lightgrey            
        }

        td:last-child {text-align: center;}

        .footer {
            background-color: lightgray;
            color: white;
            font-style: italic;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>

    <div class="profile">

        <h1>STUDENT PROFILE</h1>

        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/html5/html5-original.svg"
             alt="HTML Logo">

        <h2>Alex Rivera</h2>
        <p class="program">BS Information Technology</p>

        <h3>About Me</h3>

        <p>
            I am an IT student interested in web development,
            programming, and user interface design.
        </p>

        <h3>Current Courses</h3>

        <table>
            <tr>
                <th>Course</th>
                <th>Units</th>
            </tr>
            <tr>
                <td>Web Design</td>
                <td>3</td>
            </tr>
            <tr>
                <td>Programming</td>
                <td>3</td>
            </tr>
            <tr>
                <td>Database Systems</td>
                <td>3</td>
            </tr>
        </table>

        <p class="footer">Learning one line of code at a time.</p>

    </div>

</body>
</html>
